name: Prisma Migrate
on:
  workflow_call:
    inputs:
      environment:
        type: string
        description: "Deployment environment"
        default: "production"
      seed:
        type: boolean
        description: "Run Prisma seed script after applying migrations"
        default: false
    secrets:
      DATABASE_URL:
        description: "Database connection string"
        required: true

jobs:
  migrate:
    name: Deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Check migration status
        id: migration-status
        run: pnpm prisma migrate status
        continue-on-error: true

      - name: Execute migration
        if: steps.migration-status.outcome == 'failure'
        run: pnpm prisma migrate deploy

      - name: Verify migration
        if: steps.migration-status.outcome == 'failure'
        run: pnpm prisma migrate status

      - name: Seeding Database
        if: ${{ inputs.seed && steps.migration-status.outcome == 'failure' }}
        run: pnpm prisma db seed
