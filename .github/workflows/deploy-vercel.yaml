name: Deploy to Vercel

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
        default: "unknown"
    secrets:
      VERCEL_TOKEN:
        description: The Vercel token
        required: true
      VERCEL_ORG_ID:
        description: The Vercel organization ID
        required: true
      VERCEL_PROJECT_ID:
        description: The Vercel project ID
        required: true
    outputs:
      status:
        description: The status of the deployment
        value: ${{ jobs.deploy.outputs.status }}
      url:
        description: The URL of the deployment
        value: ${{ jobs.deploy.outputs.url }}

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.deployment_status.outputs.result }}
      url: ${{ steps.deployment.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install PNPM
        run: npm install --global pnpm@latest

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Cache pnpm store
        id: cache
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Project
        run: pnpm build

      - name: Deploy to Vercel
        id: deployment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          DEPLOY_CMD="vercel --token=${{ secrets.VERCEL_TOKEN }}"
          [[ '${{ inputs.environment }}' == 'production' ]] && DEPLOY_CMD+=" --prod"
          DEPLOY_OUTPUT=$($DEPLOY_CMD --yes)
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE "https?://[a-zA-Z0-9./_-]+")
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Set Deployment Status Output
        id: deployment_status
        if: always()
        run: echo "result=${{ steps.deployment.outcome }}" >> $GITHUB_OUTPUT
