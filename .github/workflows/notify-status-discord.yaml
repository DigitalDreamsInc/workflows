name: Notify Status to Discord
description: "Notify deployment status to Discord"

on:
  workflow_call:
    inputs:
      environment:
        type: string
        description: "Deployment environment (e.g. production, preview)"
        required: true
      short_sha:
        type: string
        description: "Short SHA of the commit"
      status:
        type: string
        default: "unknown"
        description: "Deployment status (e.g. success, failure, cancelled, skipped, in_progress)"
      url:
        type: string
        description: "URL to the deployment or relevant resource"
    secrets:
      DISCORD_WEBHOOK:
        description: "Discord webhook URL"
        required: true

jobs:
  notify:
    name: Discord
    runs-on: ubuntu-latest
    steps:
      - name: Set Metadata
        id: meta
        run: |
          # Determine color and status text
          case "${{ inputs.status }}" in
          success)
            COLOR="#22C55E"
            STATUS_TEXT="Success"
            ;;
          failure|error)
            COLOR="#EF4444"
            STATUS_TEXT="Failure"
            ;;
          cancelled)
            COLOR="#A78BFA"
            STATUS_TEXT="Cancelled"
            ;;
          skipped)
            COLOR="#FBBF24"
            STATUS_TEXT="Skipped"
            ;;
          in_progress)
            COLOR="#3B82F6"
            STATUS_TEXT="In Progress"
            ;;
          *)
            COLOR="#9CA3AF"
            STATUS_TEXT="Unknown"
            ;;
          esac

          # Generate title
          REPO="${{ github.event.repository.name }}"
          ENV="${{ inputs.environment }}"
          TITLE="Deployment notification: $REPO"

          # Generate description
          ACTOR="${{ github.actor }}"
          DESCRIPTION="A new deployment to *${ENV}* was triggered by \`${ACTOR}\`. See commit details below."

          # Output all metadata
          echo "color=$COLOR" >> $GITHUB_OUTPUT
          echo "status_text=$STATUS_TEXT" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "description<<EOF" >> $GITHUB_OUTPUT
          echo "$DESCRIPTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Notify Discord
        uses: cabrera-evil/discord-notify-action@v1.0.1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          title: ${{ steps.meta.outputs.title }}
          description: ${{ steps.meta.outputs.description }}
          color: ${{ steps.meta.outputs.color }}
          status: ${{ steps.meta.outputs.status_text }}
          environment: ${{ inputs.environment }}
          url: ${{ inputs.url }}
          repo_name: ${{ github.event.repository.name }}
          repo_url: ${{ github.event.repository.html_url }}
          commit_message: ${{ github.event.head_commit.message }}
          commit_sha: ${{ inputs.short_sha }}
          author: ${{ github.actor }}
          include_image: true
