name: Notify Status to Discord

on:
  workflow_call:
    inputs:
      description:
        type: string
        default: "A new deployment has been triggered"
      environment:
        type: string
        default: "unknown"
      short_sha:
        type: string
      status:
        type: string
        default: "unknown"
      title:
        type: string
        default: "Deployment"
      url:
        type: string
    secrets:
      DISCORD_WEBHOOK:
        description: Discord webhook URL
        required: true

jobs:
  notify:
    name: Discord
    runs-on: ubuntu-latest
    steps:
      - name: Set Environment
        id: set_environment
        run: |
          case "${{ inputs.status }}" in
          success)
            echo "color=#22C55E" >> $GITHUB_OUTPUT ;;   # green-500
          failure|error)
            echo "color=#EF4444" >> $GITHUB_OUTPUT ;;   # red-500
          cancelled)
            echo "color=#A78BFA" >> $GITHUB_OUTPUT ;;   # violet-400
          skipped)
            echo "color=#FBBF24" >> $GITHUB_OUTPUT ;;   # amber-400
          in_progress)
            echo "color=#3B82F6" >> $GITHUB_OUTPUT ;;   # blue-500
          *)
            echo "color=#9CA3AF" >> $GITHUB_OUTPUT ;;   # gray-400
          esac

      - name: Notify Discord
        uses: cabrera-evil/discord-notify-action@1.1.8
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          title: "${{ inputs.title }} notification: ${{ github.event.repository.name }}"
          description: ${{ inputs.description }}
          color: ${{ steps.set_environment.outputs.color }}
          status: ${{ inputs.status }}
          environment: ${{ inputs.environment }}
          url: ${{ inputs.url }}
          repo_name: ${{ github.event.repository.name }}
          repo_url: ${{ github.event.repository.html_url }}
          commit_message: ${{ github.event.head_commit.message }}
          commit_sha: ${{ inputs.short_sha }}
          author: ${{ github.actor }}
          include_image: true
