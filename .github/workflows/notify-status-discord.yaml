name: Notify Status to Discord
on:
  workflow_call:
    inputs:
      TITLE:
        type: string
        description: "The title of the deployment"
        default: "Deployment"
      DESCRIPTION:
        type: string
        description: "The description of the deployment"
        default: "A new deployment has been triggered"
      DISCORD_WEBHOOK_REF:
        type: string
        description: "The reference to the Discord webhook"
        required: true
      DEPLOY_STATUS:
        type: string
        description: "The status of the deployment"
        default: "unknown"
      DEPLOY_ENVIRONMENT:
        type: string
        description: "The environment of the deployment"
        default: "unknown"
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        description: The 1Password service account token
        required: true

jobs:
  notify:
    name: Discord
    runs-on: ubuntu-latest
    steps:
      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DISCORD_WEBHOOK: ${{ inputs.DISCORD_WEBHOOK_REF}}

      - name: Set Notification Variables
        id: notification_vars
        if: always()
        run: |-
          case "${{ inputs.DEPLOY_STATUS }}" in
            success) echo "color=#17C964" >> $GITHUB_OUTPUT ;;
            failure) echo "color=#F31260" >> $GITHUB_OUTPUT ;;
            *)       echo "color=#FFA500" >> $GITHUB_OUTPUT ;;
          esac

      - name: Notify Discord
        if: always()
        uses: cabrera-evil/discord-notify-action@1.1.6
        with:
          webhook_url: ${{ env.DISCORD_WEBHOOK }}
          title: "${{ inputs.TITLE }} notification: ${{ github.event.repository.name }}"
          description: "${{ inputs.DESCRIPTION }}"
          color: "${{ steps.notification_vars.outputs.color }}"
          status: "${{ inputs.DEPLOY_STATUS }}"
          environment: "${{ inputs.DEPLOY_ENVIRONMENT }}"
          repo_name: "${{ github.event.repository.name }}"
          repo_url: "${{ github.event.repository.html_url }}"
          commit_message: "${{ github.event.workflow_run.head_commit.message }}"
          commit_sha: "${{ github.sha }}"
          author: "${{ github.actor }}"
          include_image: true
