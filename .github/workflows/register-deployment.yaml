name: Register Deployment

on:
  workflow_call:
    inputs:
      environment:
        type: string
        description: "Deployment environment (e.g. production, preview)"
        required: true
      ref:
        type: string
        required: false
        description: "Commit SHA (defaults to github.sha)"
    outputs:
      deployment_id:
        description: "ID of the registered deployment"
        value: ${{ jobs.register.outputs.deployment_id }}

jobs:
  register:
    name: Register Deployment
    runs-on: ubuntu-latest
    outputs:
      deployment_id: ${{ steps.register.outputs.deployment_id }}
    steps:
      - name: Register GitHub Deployment
        id: register
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REF="${{ inputs.ref || github.sha }}"

          DEPLOYMENT_ID=$(gh api repos/${{ github.repository }}/deployments -X POST \
            -F ref="$REF" \
            -F environment="${{ inputs.environment }}" \
            -F auto_merge=false \
            -F transient_environment=${{ inputs.environment != 'production' }} \
            -F production_environment=${{ inputs.environment == 'production' }} \
            --jq '.id')

          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT

      - name: Mark as in_progress
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/deployments/${{ steps.register.outputs.deployment_id }}/statuses -X POST \
            -f state="in_progress"
