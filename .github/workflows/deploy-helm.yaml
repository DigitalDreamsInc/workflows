name: Deploy to Kubernetes With Helm

on:
  workflow_call:
    inputs:
      docker_image:
        type: string
        required: true
        description: "Full image name (e.g., cabreraevil/my-api)"
      short_sha:
        type: string
        description: "The short image tag SHA (optional; defaults to latest)"
      environment:
        type: string
        description: "Deployment environment (e.g. production, preview)"
        required: true
      chart:
        type: string
        required: true
        description: "Helm chart to deploy (e.g., cabrera-evil/deploy-chart)"
      release_name:
        type: string
        required: true
        description: "Helm release name (e.g., api)"
      namespace:
        type: string
        required: true
        description: "Kubernetes namespace to deploy to"
    secrets:
      KUBECONFIG:
        required: true
        description: "Base64-encoded kubeconfig file"
      HELM_VALUES:
        required: true
        description: "Base64-encoded Helm values.yaml file"
    outputs:
      status:
        description: The status of the deployment
        value: ${{ jobs.deploy.outputs.status }}

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.deployment_status.outputs.result }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Prepare Kubeconfig and Helm values
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          echo "${{ secrets.HELM_VALUES }}" | base64 -d > values.yaml
          chmod 600 ~/.kube/config

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Add Helm Repo
        run: |
          helm repo add cabrera-evil https://cabrera-evil.github.io/charts/
          helm repo update

      - name: Deploy with Helm
        id: deployment
        run: |
          IMAGE_TAG="${{ inputs.short_sha && format('sha-{0}', inputs.short_sha) || 'latest' }}"
          helm upgrade --install ${{ inputs.release_name }} \
            ${{ inputs.chart }} \
            --namespace "${{ inputs.namespace }}-${{ inputs.environment }}" \
            --create-namespace \
            --values values.yaml \
            --set image.repository=${{ inputs.docker_image }} \
            --set image.tag=$IMAGE_TAG
        continue-on-error: true

      - name: Set Deployment Status Output
        id: deployment_status
        if: always()
        run: |
          RELEASE_NAME="${{ inputs.release_name }}"
          NAMESPACE="${{ inputs.namespace }}-${{ inputs.environment }}"

          echo "Identifying Kubernetes deployment associated with Helm release '${RELEASE_NAME}' in namespace '${NAMESPACE}'..."
          DEPLOYMENT=$(kubectl get deploy -n "$NAMESPACE" \
            -l "app.kubernetes.io/instance=$RELEASE_NAME" \
            -o jsonpath="{.items[0].metadata.name}")

          if [ -z "$DEPLOYMENT" ]; then
            echo "Error: No matching deployment found for Helm release '${RELEASE_NAME}' in namespace '${NAMESPACE}'."
            echo "result=failure" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "Deployment '${DEPLOYMENT}' identified. Monitoring rollout status..."
          if kubectl rollout status deployment/"$DEPLOYMENT" -n "$NAMESPACE" --timeout=5m; then
            echo "Deployment '${DEPLOYMENT}' completed successfully."
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "Error: Deployment '${DEPLOYMENT}' did not complete successfully within the timeout period."
            echo "result=failure" >> $GITHUB_OUTPUT
          fi

