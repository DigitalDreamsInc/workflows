name: Static Dependency Security Analysis
description: "Static dependency security analysis using Snyk"

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
        description: "Branch or ref that triggered the scan"
    secrets:
      SNYK_TOKEN:
        required: true
        description: "Snyk token"

permissions:
  security-events: write # Required to upload SARIF files
  actions: read # Required to download actions
  contents: read # Required to checkout the code

jobs:
  deps_security:
    name: Deps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install PNPM
        run: npm install --global pnpm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif

      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
