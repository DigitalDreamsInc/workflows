name: Static Dependency Security Analysis
description: "Static dependency security analysis using Snyk"

on:
  workflow_call:
    inputs:
      report:
        type: boolean
        description: "Whether to report the results to GitHub Code Scanning"
        default: false
    secrets:
      SNYK_TOKEN:
        required: true
        description: "Snyk token"

permissions:
  security-events: write # Required to upload SARIF files
  actions: read # Required to download actions
  contents: read # Required to checkout the code

jobs:
  deps_security:
    name: Deps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          always-auth: true

      - name: Install PNPM
        run: npm install --global pnpm@latest

      - name: Cache pnpm store
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: ${{ inputs.report == 'true' }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif

      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: ${{ inputs.report == 'true' }}
        with:
          sarif_file: snyk.sarif
