name: Reusable Go Release

on:
  workflow_call:
    inputs:
      go-version-file:
        description: Path to go.mod for version detection
        required: false
        type: string
        default: go.mod
      goflags:
        description: Global GOFLAGS to apply
        required: false
        type: string
        default: "-mod=readonly"
      goreleaser-args:
        description: Extra arguments passed to goreleaser
        required: false
        type: string
        default: "release --clean"
      svu-version:
        description: Pinned svu release to install for version tagging
        required: false
        type: string
        default: "v3.4.1"
    secrets:
      GOPRIVATE:
        required: false
        description: Optional GOPRIVATE override
    outputs:
      tag:
        description: The computed next tag (equal to the current tag when nothing warranted a release)
        value: ${{ jobs.tag.outputs.tag }}
      released:
        description: "true if a new tag was created and GoReleaser ran"
        value: ${{ jobs.tag.outputs.created }}

permissions:
  contents: write

env:
  GOFLAGS: ${{ inputs.goflags }}
  GOPRIVATE: ${{ secrets.GOPRIVATE }}

jobs:
  tag:
    name: Tag
    uses: ./.github/workflows/semver-tag.yaml
    with:
      svu-version: ${{ inputs.svu-version }}
    secrets: inherit

  goreleaser:
    name: GoReleaser
    needs: [tag]
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: ${{ inputs.goreleaser-args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
