name: Reusable Go Release

on:
  workflow_call:
    inputs:
      go-version-file:
        description: Path to go.mod for version detection
        required: false
        type: string
        default: go.mod
      goflags:
        description: Global GOFLAGS to apply
        required: false
        type: string
        default: "-mod=readonly"
      goreleaser-args:
        description: Extra arguments passed to goreleaser
        required: false
        type: string
        default: "release --clean"
    secrets:
      GOPRIVATE:
        required: false
        description: Optional GOPRIVATE override

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: ${{ inputs.goflags }}
  GOPRIVATE: ${{ secrets.GOPRIVATE }}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5.6.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6.4.0
        with:
          distribution: goreleaser
          version: latest
          args: ${{ inputs.goreleaser-args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
