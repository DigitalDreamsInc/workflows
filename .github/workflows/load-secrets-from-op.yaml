name: Load Secrets From 1Password

on:
  workflow_call:
    inputs:
      secrets:
        type: string
        required: true
        description: Comma-separated list like VAR=op://...
    secrets:
      op_token:
        required: true
        description: 1Password Service Account Token
    outputs:
      exported:
        description: All secrets as a JSON object
        value: ${{ jobs.load.outputs.exported }}

jobs:
  load:
    name: OP Secrets
    runs-on: ubuntu-latest
    outputs:
      exported: ${{ steps.read.outputs.exported }}
    steps:
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Load and export secrets
        id: read
        shell: bash
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.op_token }}
          INPUTS: ${{ inputs.secrets }}
        run: |
          IFS=',' read -ra pairs <<< "$INPUTS"
          json="{"

          for pair in "${pairs[@]}"; do
            key="${pair%%=*}"
            ref="${pair#*=}"

            value=$(op read "$ref" | tr -d '\n')
            if [[ -z "$value" ]]; then
              echo "::error::Failed to read secret for $key"
              exit 1
            fi

            echo "$key=$value" >> "$GITHUB_ENV"

            value_json=$(printf '%s' "$value" | jq -Rsa .)
            json+="\"$key\":$value_json,"
          done

          json="${json%,}}"
          echo "exported=$json" >> "$GITHUB_OUTPUT"
