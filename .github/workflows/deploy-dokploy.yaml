name: Deploy to Dokploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        description: "Deployment environment (e.g. production, preview)"
        required: true
      tailscale:
        type: boolean
        description: "Connect to Tailscale before deploying"
        default: false
      tailscale_tags:
        type: string
        description: "Comma-separated Tailscale tags applied to the ephemeral node (e.g. tag:ci)"
        default: ""
    secrets:
      DOKPLOY_WEBHOOK:
        description: The Vercel token
        required: true
      TS_OAUTH_CLIENT_ID:
        description: "Tailscale OAuth client ID"
        required: false
      TS_OAUTH_SECRET:
        description: "Tailscale OAuth client secret"
        required: false
      TAILSCALE_AUTHKEY:
        description: "Tailscale auth key (alternative to OAuth)"
        required: false
    outputs:
      status:
        description: "The status of the deployment"
        value: ${{ jobs.deploy.outputs.status }}

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ job.status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Tailscale
        if: ${{ inputs.tailscale }}
        uses: tailscale/github-action@v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: ${{ inputs.tailscale_tags }}

      - name: Trigger Dokploy Deployment
        run: |
          curl -X 'POST' '${{ secrets.DOKPLOY_WEBHOOK }}'
