name: Set Deployment Status

on:
  workflow_call:
    inputs:
      deployment_id:
        type: string
        required: true
        description: "GitHub Deployment ID"
      state:
        type: string
        required: true
        description: "Deployment state: success, failure, error, inactive, etc."
      url:
        type: string
        required: false
        description: "Final deployed URL"

jobs:
  set_status:
    name: Set Deployment Status
    runs-on: ubuntu-latest
    steps:
      - name: Set Deployment Status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(-f state="${{ inputs.state }}")
          if [[ -n "${{ inputs.url }}" ]]; then
            ARGS+=(-f environment_url="${{ inputs.url }}")
          fi
          gh api repos/${{ github.repository }}/deployments/${{ inputs.deployment_id }}/statuses -X POST "${ARGS[@]}"
