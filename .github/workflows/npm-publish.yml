name: Publish to NPM

on:
  workflow_call:
    inputs:
      NPM_TOKEN_REF:
        type: string
        description: The reference to the NPM token
        required: true
    outputs:
      status:
        description: The status of the deployment
        value: ${{ jobs.publish.outputs.status }}
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        description: The 1Password service account token
        required: true

jobs:
  publish:
    name: NPM
    outputs:
      status: ${{ steps.publish_status.outputs.status }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          NPM_TOKEN: ${{ inputs.NPM_TOKEN_REF }}

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install PNPM
        run: npm install --global pnpm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build package
        run: pnpm build

      - name: Publish to NPM registry
        id: publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{env.NPM_TOKEN}}
        continue-on-error: true

      - name: Set Publish Status Output
        id: publish_status
        run: |
          if [ "${{ steps.publish.outcome }}" == "success" ]; then
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "result=failure" >> $GITHUB_OUTPUT
          fi
