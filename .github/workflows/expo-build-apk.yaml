name: Expo APK

on:
  workflow_call:
    inputs:
      environment:
        type: string
        description: "Deployment environment (e.g. production, preview)"
        required: false
        default: production
      runner:
        description: Runner label or JSON array of labels
        required: false
        type: string
        default: '["ubuntu-latest"]'
      node_version:
        description: Node.js version
        required: false
        type: string
        default: "24"
      java_version:
        description: Java version
        required: false
        type: string
        default: "17"
      artifact_name:
        description: APK artifact name
        required: false
        type: string
        default: app-release-apk
      gradle_task:
        description: Gradle task to run
        required: false
        type: string
        default: :app:assembleRelease
      gradle_init_script:
        description: Optional Gradle init script path
        required: false
        type: string
        default: ""
      prebuild:
        description: Run expo prebuild when android/ is missing
        required: false
        type: boolean
        default: true
      working_directory:
        description: Android project directory
        required: false
        type: string
        default: android
      retention_days:
        description: Artifact retention days
        required: false
        type: number
        default: 14
    secrets:
      ANDROID_KEYSTORE_BASE64:
        description: Base64-encoded Android release keystore
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        description: Android release keystore password
        required: false
      ANDROID_KEY_ALIAS:
        description: Android release key alias
        required: false
      ANDROID_KEY_PASSWORD:
        description: Android release key password
        required: false
    outputs:
      artifact_name:
        description: Resolved APK artifact name used in upload
        value: ${{ jobs.build_apk.outputs.artifact_name }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build_apk:
    name: Expo APK
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.resolve_apk.outputs.artifact_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android native project
        if: ${{ inputs.prebuild && !hashFiles('android/gradlew') }}
        run: pnpm expo prebuild --platform android --non-interactive --no-install

      - name: Setup Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.0.1

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.0

      - name: Create Android local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Prepare release signing
        id: prepare_signing
        env:
          HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        if: ${{ inputs.environment == 'production' && env.HAS_ANDROID_KEYSTORE == 'true' }}
        run: |
          keystore_dir="$RUNNER_TEMP/android-signing"
          keystore_path="$keystore_dir/release.keystore"
          mkdir -p "$keystore_dir"
          printf '%s' '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"

          echo "ANDROID_KEYSTORE_FILE=$keystore_path" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          echo "has_signing=true" >> "$GITHUB_OUTPUT"

      - name: Resolve APK variant
        id: resolve_apk
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            apk_variant="release"
            apk_gradle_task=":app:assembleRelease"
            default_artifact_name="app-release-apk"
          else
            apk_variant="debug"
            apk_gradle_task=":app:assembleDebug"
            default_artifact_name="app-debug-apk"
          fi

          apk_artifact_name="${{ inputs.artifact_name }}"
          if [ -z "$apk_artifact_name" ] || [ "$apk_artifact_name" = "app-release-apk" ]; then
            apk_artifact_name="$default_artifact_name"
          fi

          echo "APK_VARIANT=$apk_variant" >> "$GITHUB_ENV"
          echo "APK_GRADLE_TASK=$apk_gradle_task" >> "$GITHUB_ENV"
          echo "apk_variant=$apk_variant" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$apk_artifact_name" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ inputs.working_directory }}
        run: |
          extra_args=()
          if [ "${{ steps.prepare_signing.outputs.has_signing }}" = "true" ]; then
            extra_args+=("-Pandroid.injected.signing.store.file=$ANDROID_KEYSTORE_FILE")
            extra_args+=("-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD")
            extra_args+=("-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS")
            extra_args+=("-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD")
          fi

          if [ -n "${{ inputs.gradle_init_script }}" ]; then
            ./gradlew "$APK_GRADLE_TASK" \
              -I "${{ inputs.gradle_init_script }}" \
              "${extra_args[@]}" \
              --build-cache
          else
            ./gradlew "$APK_GRADLE_TASK" \
              "${extra_args[@]}" \
              --build-cache
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: ${{ steps.resolve_apk.outputs.artifact_name }}
          path: ${{ inputs.working_directory }}/app/build/outputs/apk/${{ steps.resolve_apk.outputs.apk_variant }}/*.apk
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
