name: Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      DEPLOY_ENVIRONMENT:
        type: string
        description: "The environment of the deployment"
        default: "unknown"
      SECRET_REF:
        type: string
        description: The reference to the Kubernetes secret
        required: true
      KUBECONFIG_REF:
        type: string
        description: The reference to the Kubernetes configuration
        required: true
    outputs:
      status:
        description: The status of the deployment
        value: ${{ jobs.deploy.outputs.status }}
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        description: The 1Password service account token
        required: true

jobs:
  deploy:
    name: ${{ inputs.DEPLOY_ENVIRONMENT }}
    outputs:
      status: ${{ steps.deployment_status.outputs.result }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1.0.0

      - name: Prepare Secrets
        working-directory: k8s
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SECRET: ${{ inputs.SECRET_REF }}
        run: |
          op read "$SECRET" | base64 --decode > secret.yaml

      - name: Install Kustomize
        working-directory: k8s
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash

      - name: Set Docker Image in Kustomize
        working-directory: k8s
        run: |
          kustomize edit set image "${{ env.DOCKER_USERNAME }}/${{ github.event.repository.name }}=${{ env.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.sha }}"

      - name: Configure Kubernetes Access
        working-directory: k8s
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          KUBECONFIG: ${{ inputs.KUBECONFIG_REF }}
        run: |
          mkdir -p ~/.kube
          op read "$KUBECONFIG" | base64 --decode > ~/.kube/config

      - name: Apply Kubernetes Manifests
        id: deployment
        working-directory: k8s
        run: |
          kustomize build . | kubectl apply -f -
        continue-on-error: true

      - name: Set Deployment Status Output
        id: deployment_status
        run: |
          case "${{ steps.deployment.outcome }}" in
            success) echo "result=success" >> $GITHUB_OUTPUT ;;
            failure) echo "result=failure" >> $GITHUB_OUTPUT ;;
            *)       echo "result=unknown" >> $GITHUB_OUTPUT ;;
          esac
