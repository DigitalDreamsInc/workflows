name: Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      environment:
        type: string
        description: "Deployment environment (e.g. production, preview)"
        required: true
      short_sha:
        type: string
      docker_image:
        type: string
        required: true
        description: "Image name without tag and owner (e.g., my-api)"
      tailscale:
        type: boolean
        description: "Connect to Tailscale before deploying"
        default: false
      tailscale_tags:
        type: string
        description: "Comma-separated Tailscale tags applied to the ephemeral node (e.g. tag:ci)"
        default: ""
    secrets:
      KUBECONFIG:
        description: Base64-encoded kubeconfig file
        required: true
      K8S_SECRET:
        description: Base64-encoded Kubernetes secret YAML
        required: true
      TS_OAUTH_CLIENT_ID:
        description: "Tailscale OAuth client ID"
        required: false
      TS_OAUTH_SECRET:
        description: "Tailscale OAuth client secret"
        required: false
      TAILSCALE_AUTHKEY:
        description: "Tailscale auth key (alternative to OAuth)"
        required: false

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Tailscale
        if: ${{ inputs.tailscale }}
        uses: tailscale/github-action@v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: ${{ inputs.tailscale_tags }}

      - name: Set up Kubernetes Config and Secret
        working-directory: k8s
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          echo "${{ secrets.K8S_SECRET }}" | base64 -d > secret.yaml

      - name: Install Kustomize
        working-directory: k8s
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash

      - name: Set Docker Image in Kustomize
        working-directory: k8s
        run: |
          IMAGE_TAG="${{ inputs.short_sha && format('sha-{0}', inputs.short_sha) || 'latest' }}"
          kustomize edit set image "${{ secrets.DOCKER_USERNAME }}/${{ inputs.docker_image }}=${{ secrets.DOCKER_USERNAME }}/${{ inputs.docker_image }}:$IMAGE_TAG"

      - name: Apply Kubernetes Manifests
        working-directory: k8s
        run: |
          kustomize build . | kubectl apply -f -
