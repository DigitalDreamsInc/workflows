name: Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      environment:
        type: string
        default: "unknown"
      short_sha:
        type: string
      image_name:
        type: string
        required: true
        description: "Full image name (e.g., cabrera/my-api)"
    secrets:
      kubeconfig:
        description: Base64-encoded kubeconfig file
        required: true
      k8s_secret:
        description: Base64-encoded Kubernetes secret YAML
        required: true
    outputs:
      status:
        description: The status of the deployment
        value: ${{ jobs.deploy.outputs.status }}

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.deployment_status.outputs.result }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Kubernetes Config and Secret
        working-directory: k8s
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.kubeconfig }}" | base64 -d > ~/.kube/config
          echo "${{ secrets.k8s_secret }}" | base64 -d > secret.yaml

      - name: Install Kustomize
        working-directory: k8s
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash

      - name: Set Docker Image in Kustomize
        working-directory: k8s
        run: |
          IMAGE_TAG="${{ inputs.short_sha && format('sha-{0}', inputs.short_sha) || 'latest' }}"
          kustomize edit set image "${{ inputs.image_name }}=${{ inputs.image_name }}:$IMAGE_TAG"

      - name: Apply Kubernetes Manifests
        id: deployment
        working-directory: k8s
        run: |
          kustomize build . | kubectl apply -f -
        continue-on-error: true

      - name: Set Deployment Status Output
        id: deployment_status
        if: always()
        run: echo "result=${{ steps.deployment.outcome }}" >> $GITHUB_OUTPUT
