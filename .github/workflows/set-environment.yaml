name: Set Environment
on:
  workflow_call:
    inputs:
      ref:
        type: string
        description: 'The branch to deploy'
        required: true
    outputs:
      environment:
        description: 'The deployment environment'
        value: ${{ jobs.set_environment.outputs.environment }}
      short_sha:
        description: 'The short SHA of the deployment'
        value: ${{ jobs.set_environment.outputs.short_sha }}

jobs:
  set_environment:
    name: Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set_environment.outputs.environment }}
      short_sha: ${{ steps.set_environment.outputs.short_sha }}
    steps:
      - name: Checkout
        id: set_environment
        run: |-
          # Set deployment environment based on branch
          case ${{ inputs.ref }} in
            refs/heads/master|refs/heads/main)
              echo "environment=production" >> $GITHUB_OUTPUT ;;
            *)
              echo "environment=preview" >> $GITHUB_OUTPUT ;;
          esac
          # Get git short SHA
          case "${{ github.event_name }}" in
            pull_request)
              echo "short_sha=$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
              ;;
          esac