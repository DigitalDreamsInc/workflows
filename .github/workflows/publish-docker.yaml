name: Publish to Docker

on:
  workflow_call:
    inputs:
      docker_image:
        type: string
        required: true
        description: "Full image name (e.g., cabreraevil/my-api)"
    secrets:
      DOCKER_USERNAME:
        description: Docker Hub username
        required: true
      DOCKER_PASSWORD:
        description: Docker Hub password or token
        required: true
    outputs:
      latest_tag:
        description: The latest tag of the Docker image
        value: ${{ jobs.publish.outputs.latest_tag }}

jobs:
  publish:
    name: Docker
    runs-on: ubuntu-latest
    outputs:
      latest_tag: ${{ steps.latest_tag.outputs.latest_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare Docker Metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.docker_image }}
          tags: |
            type=raw,value=latest,enable=${{ endsWith(github.ref, github.event.repository.default_branch) }}
            type=sha,value={{ github.sha }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        id: publish
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Set Latest Tag Output
        id: latest_tag
        run: |
          echo "latest_tag=$(echo '${{ steps.docker_meta.outputs.tags }}' | tr ',' '\n' | grep 'sha-')" >> $GITHUB_OUTPUT
