name: Update Deployment

on:
  workflow_call:
    inputs:
      environment:
        type: string
        description: "Deployment environment (e.g. production, preview)"
        required: true
      url:
        type: string
        description: "Deployed URL (e.g. from Vercel)"
        required: true

jobs:
  update:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Update repository metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            echo "Updating repo homepage to ${{ inputs.url }}"
            gh api repos/${{ github.repository }} -X PATCH -f homepage="${{ inputs.url }}"
          else
            echo "Updating repo description with preview URL"
            gh api repos/${{ github.repository }} -X PATCH -f description="Preview: ${{ inputs.url }}"
          fi

      - name: Register GitHub Deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/deployments -X POST \
            -f ref="${{ github.sha }}" \
            -f environment="${{ inputs.environment }}" \
            -f description="Deployment to ${{ inputs.url }}" \
            -f required_contexts="[]" \
            -f auto_merge="false" \
            -f transient_environment="${{ inputs.environment != 'production' }}" \
            -f production_environment="${{ inputs.environment == 'production' }}"
